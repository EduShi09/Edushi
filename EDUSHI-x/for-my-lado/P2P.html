<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Talky Zone</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        *, *::before, *::after {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        :root {
            --bg-main: #0b0f19;
            --bg-card: #161e2e;
            --primary: #6366f1;
            --gold-owner: #ffd700;
            --purple-pro: #a855f7;
            --text-light: #f3f4f6;
        }

        html, body {
            width: 100%; height: 100%;
            background-color: var(--bg-main);
            color: var(--text-light);
            overflow: hidden;
        }

        /* Responsive Wrapper */
        .app-container {
            width: 100vw;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            background: var(--bg-main);
        }

        @media (min-width: 768px) {
            body {
                display: flex;
                justify-content: center;
                align-items: center;
            }
            .app-container {
                width: 100%;
                max-width: 850px;
                height: 92vh;
                border-radius: 20px;
                background: var(--bg-card);
                border: 1px solid rgba(255, 255, 255, 0.08);
                box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            }
        }

        /* HEADER */
        .chat-header {
            padding: 12px 16px;
            background: #0f172a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            flex-shrink: 0;
        }

        .user-profile-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .pfp-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary);
            cursor: pointer;
        }

        .role-badge {
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 10px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .badge-owner { background: rgba(255, 215, 0, 0.2); color: var(--gold-owner); border: 1px solid var(--gold-owner); }
        .badge-pro { background: rgba(168, 85, 247, 0.2); color: var(--purple-pro); border: 1px solid var(--purple-pro); }
        .badge-normal { background: rgba(255, 255, 255, 0.1); color: #9ca3af; }

        .header-actions button {
            background: none; border: none; color: #9ca3af;
            font-size: 18px; cursor: pointer;
        }

        /* CHAT BOX */
        #chat-box {
            flex: 1;
            padding: 16px 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #0b0f19;
        }

        /* MESSAGE BUBBLES */
        .msg-row {
            display: flex;
            flex-direction: column;
            max-width: 88%;
            word-break: break-word;
            user-select: none;
        }

        .msg-row.sent { align-self: flex-end; }
        .msg-row.received { align-self: flex-start; }

        .msg-bubble {
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 14.5px;
            line-height: 1.45;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .received .msg-bubble {
            background: #1e293b;
            color: #f8fafc;
            border-top-left-radius: 4px;
        }

        .sent .msg-bubble {
            background: #3730a3;
            color: #ffffff;
            border-top-right-radius: 4px;
        }

        .msg-sender-name {
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #cbd5e1;
        }

        .msg-time {
            font-size: 9.5px;
            color: #94a3b8;
            margin-top: 4px;
            text-align: right;
        }

        .delete-btn {
            font-size: 11px;
            color: #ef4444;
            cursor: pointer;
            margin-left: auto;
        }

        .msg-bubble a { color: #38bdf8 !important; text-decoration: underline; }

        .style-owner { border-left: 3px solid var(--gold-owner) !important; }
        .style-pro { border-left: 3px solid var(--purple-pro) !important; }

        /* INPUT AREA */
        .chat-input-area {
            padding: 10px 12px;
            background: #0f172a;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            flex-shrink: 0;
        }

        .active-reply-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(99, 102, 241, 0.15);
            border-left: 3px solid var(--primary);
            padding: 6px 10px;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 12px;
        }

        .reply-preview-box {
            background: rgba(0, 0, 0, 0.3);
            border-left: 3px solid var(--primary);
            padding: 6px 8px;
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 6px;
            color: #cbd5e1;
        }

        .input-wrapper {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .input-wrapper input {
            flex: 1;
            background: #1e293b;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 14px;
            border-radius: 12px;
            color: #fff;
            outline: none;
            font-size: 14px;
        }

        .input-wrapper button {
            background: var(--primary);
            color: #fff;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            cursor: pointer;
            flex-shrink: 0;
        }

        /* MODALS */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(5, 8, 15, 0.95);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            padding: 20px;
        }

        .glass-card {
            background: #161e2e;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 24px;
            width: 100%;
            max-width: 380px;
            text-align: center;
        }

        .glass-card input {
            width: 100%;
            padding: 12px;
            margin: 16px 0;
            background: #0f172a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
            text-align: center;
            font-size: 18px;
            letter-spacing: 4px;
        }

        .glass-card button {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="auth-modal" class="modal-overlay">
        <div class="glass-card">
            <h2><i class="fa-solid fa-comments"></i> Talky Zone</h2>
            <p style="font-size: 12px; color: #94a3b8; margin-top: 6px;">Enter your 6-digit key</p>
            <input type="password" id="user-key-input" maxlength="6" placeholder="******">
            <button onclick="authenticateUser()">Unlock Chat</button>
        </div>
    </div>

    <div id="welcome-modal" class="modal-overlay hidden">
        <div class="glass-card">
            <i class="fa-solid fa-circle-check" style="font-size: 36px; color: #22c55e;"></i>
            <h3 id="welcome-msg" style="margin-top: 12px; font-size: 16px;"></h3>
            <button style="margin-top: 18px;" onclick="closeWelcomeModal()">Let's Chat!</button>
        </div>
    </div>

    <div id="admin-modal" class="modal-overlay hidden">
        <div class="glass-card" style="text-align: left;">
            <h3><i class="fa-solid fa-user-gear"></i> Owner Dashboard</h3>
            <p style="font-size: 12px; color: #94a3b8; margin-bottom: 12px;">Add New User</p>
            
            <input type="text" id="new-user-name" placeholder="Name" style="margin: 0 0 10px 0; letter-spacing: normal; font-size: 14px; text-align: left;">
            <input type="text" id="new-user-key" placeholder="6-Digit Key" maxlength="6" style="margin: 0 0 10px 0; font-size: 14px;">
            <select id="new-user-role" style="width: 100%; padding: 10px; background: #0f172a; color: white; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; margin-bottom: 12px;">
                <option value="normal">Normal</option>
                <option value="pro">Pro</option>
            </select>
            <button onclick="addNewUser()" style="margin-bottom: 8px;">Add User</button>
            <button onclick="toggleModal('admin-modal', false)" style="background: #475569;">Close</button>
        </div>
    </div>

    <div class="app-container">
        <div class="chat-header">
            <div class="user-profile-info">
                <img id="my-pfp" class="pfp-avatar" src="" title="Click to change DP" onclick="changePFP()">
                <div>
                    <div style="display: flex; align-items: center; gap: 6px;">
                        <span id="my-name" style="font-weight: 600; font-size: 14px;">User</span>
                        <span id="my-role-badge" class="role-badge"></span>
                    </div>
                    <span style="font-size: 10px; color: #22c55e;">● Online</span>
                </div>
            </div>
            <div class="header-actions">
                <button id="admin-btn" class="hidden" onclick="toggleModal('admin-modal', true)"><i class="fa-solid fa-sliders"></i></button>
            </div>
        </div>

        <div id="chat-box"></div>

        <div class="chat-input-area">
            <div id="reply-bar" class="active-reply-bar hidden">
                <span id="reply-text-preview" style="color: #cbd5e1;">Replying...</span>
                <i class="fa-solid fa-xmark" style="cursor: pointer;" onclick="cancelReply()"></i>
            </div>
            <div class="input-wrapper">
                <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off">
                <button onclick="sendGroupMessage()"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://sxrdpcfyvmicjqzzwjqv.supabase.co";
        const SUPABASE_KEY = "sb_publishable_NapVtLJzaIpxmvrcY4TT7A_D1ll1tfp";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;
        let selectedReply = null;

        async function authenticateUser() {
            const key = document.getElementById("user-key-input").value.trim();
            if (key.length !== 6) return alert("Enter valid 6-digit key!");

            const { data, error } = await supabaseClient
                .from('group_users')
                .select('*')
                .eq('user_key', key)
                .single();

            if (error || !data) {
                alert("Invalid Access Key!");
                return;
            }

            currentUser = data;
            toggleModal('auth-modal', false);

            document.getElementById('my-name').innerText = currentUser.name;
            document.getElementById('my-pfp').src = currentUser.pfp_url;
            
            const badge = document.getElementById('my-role-badge');
            badge.innerText = currentUser.role;
            badge.className = `role-badge badge-${currentUser.role}`;

            if (currentUser.role === 'owner') {
                document.getElementById('admin-btn').classList.remove('hidden');
            }

            document.getElementById('welcome-msg').innerText = `Welcome ${currentUser.name} to this amazing talky zone! Let's share your emotions.`;
            toggleModal('welcome-modal', true);

            loadGroupMessages();
            listenRealtimeMessages();
        }

        function closeWelcomeModal() {
            toggleModal('welcome-modal', false);
        }

        async function loadGroupMessages() {
            const { data: messages, error } = await supabaseClient
                .from('group_messages')
                .select('*')
                .order('id', { ascending: false })
                .limit(500);

            if (error) return console.error(error);

            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML = '';

            messages.reverse().forEach(msg => renderMessageUI(msg));
            scrollToBottom();
        }

        function listenRealtimeMessages() {
            supabaseClient
                .channel('group-chat')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'group_messages' }, payload => {
                    renderMessageUI(payload.new);
                    scrollToBottom();
                })
                .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'group_messages' }, payload => {
                    const elem = document.getElementById(`msg-${payload.old.id}`);
                    if (elem) elem.remove();
                })
                .subscribe();
        }

        function linkifyText(text) {
            const urlRegex = /(https?:\/\/[^\s]+|www\.[^\s]+|[a-zA-Z0-9.-]+\.(com|in|org|net|io)[^\s]*)/g;
            return text.replace(urlRegex, (url) => {
                let href = url.startsWith('http') ? url : `https://${url}`;
                return `<a href="${href}" target="_blank">${url}</a>`;
            });
        }

        function renderMessageUI(msg) {
            const chatBox = document.getElementById('chat-box');
            const isMe = msg.sender_key === currentUser.user_key;
            
            let replyHTML = msg.reply_to ? `<div class="reply-preview-box"><b>${msg.reply_to.sender}:</b> ${msg.reply_to.text}</div>` : '';
            let formattedMsg = linkifyText(msg.message);
            let timeStr = new Date(msg.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            const msgHTML = `
                <div class="msg-row ${isMe ? 'sent' : 'received'}" id="msg-${msg.id}">
                    <div class="msg-bubble style-${msg.sender_role}" ondblclick="triggerReply('${msg.sender_name}', '${msg.message}')">
                        <div class="msg-sender-name">
                            <span class="role-badge badge-${msg.sender_role}">${msg.sender_role}</span>
                            ${msg.sender_name}
                            ${isMe ? `<i class="fa-solid fa-trash delete-btn" onclick="deleteMessage(${msg.id})"></i>` : ''}
                        </div>
                        ${replyHTML}
                        <div>${formattedMsg}</div>
                        <div class="msg-time">${timeStr}</div>
                    </div>
                </div>
            `;
            chatBox.insertAdjacentHTML('beforeend', msgHTML);
        }

        async function sendGroupMessage() {
            const input = document.getElementById('message-input');
            const text = input.value.trim();
            if (!text) return;

            const payload = {
                sender_name: currentUser.name,
                sender_key: currentUser.user_key,
                sender_role: currentUser.role,
                sender_pfp: currentUser.pfp_url,
                message: text,
                reply_to: selectedReply
            };

            input.value = '';
            cancelReply();

            await supabaseClient.from('group_messages').insert([payload]);
        }

        function triggerReply(sender, text) {
            selectedReply = { sender, text };
            document.getElementById('reply-text-preview').innerText = `Replying to ${sender}: "${text}"`;
            document.getElementById('reply-bar').classList.remove('hidden');
        }

        function cancelReply() {
            selectedReply = null;
            document.getElementById('reply-bar').classList.add('hidden');
        }

        async function deleteMessage(id) {
            if (confirm("Delete this message?")) {
                await supabaseClient.from('group_messages').delete().eq('id', id);
            }
        }

        async function addNewUser() {
            const name = document.getElementById('new-user-name').value.trim();
            const key = document.getElementById('new-user-key').value.trim();
            const role = document.getElementById('new-user-role').value;

            if (!name || key.length !== 6) return alert("Fill out all fields correctly!");

            const { error } = await supabaseClient.from('group_users').insert([{ name, user_key: key, role }]);
            if (error) alert("Error adding user: " + error.message);
            else {
                alert("User added!");
                toggleModal('admin-modal', false);
            }
        }

        async function changePFP() {
            const newURL = prompt("Enter new Image URL:", currentUser.pfp_url);
            if (newURL) {
                currentUser.pfp_url = newURL;
                document.getElementById('my-pfp').src = newURL;
                await supabaseClient.from('group_users').update({ pfp_url: newURL }).eq('id', currentUser.id);
            }
        }

        function toggleModal(id, show) {
            document.getElementById(id).classList.toggle('hidden', !show);
        }

        function scrollToBottom() {
            const box = document.getElementById('chat-box');
            box.scrollTop = box.scrollHeight;
        }

        document.getElementById('message-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendGroupMessage();
        });
    </script>
</body>
</html>
