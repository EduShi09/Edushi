<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talky Dashboard</title>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/user.css">
</head>
<body>

    <!-- Overlay for Sidebar -->
    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

    <!-- Sidebar Drawer -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="brand-logo">
                <div class="talky-icon-box">
                    <i class="fa-solid fa-comments"></i>
                </div>
                <span class="brand-name">TALKY</span>
            </div>
            <button class="close-btn" onclick="toggleSidebar()">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <ul class="nav-links">
            <li><a href="#" class="active"><i class="fa-solid fa-house"></i> Home</a></li>
            <li><a href="#"><i class="fa-solid fa-user"></i> Profile</a></li>
            <li><a href="#"><i class="fa-solid fa-comment-dots"></i> Messages</a></li>
            <li><a href="#"><i class="fa-solid fa-heart"></i> My Favorites</a></li>
            <li><a href="#"><i class="fa-solid fa-user-plus"></i> Invite Friends</a></li>
            <li><a href="#"><i class="fa-solid fa-crown"></i> Meet Owner</a></li>
            <li class="logout-link"><a href="#"><i class="fa-solid fa-right-from-bracket"></i> Log Out</a></li>
        </ul>
    </aside>

    <!-- Header Toggle -->
    <header class="top-bar">
        <button class="toggle-btn" onclick="toggleSidebar()" aria-label="Toggle Menu">
            <i class="fa-solid fa-bars"></i>
        </button>
    </header>

    <!-- Main Content -->
    <main class="container">
        <!-- Custom Unique Logo -->
        <div class="logo-container">
            <div class="talky-logo">
                <i class="fa-solid fa-comments"></i>
            </div>
        </div>

        <h1 class="welcome-title">Welcome to Talky</h1>

        <div class="tagline-badge">
            <i class="fa-solid fa-sparkles"></i>
            TALKY — Connect, Share & Play
        </div>

        <!-- Dashboard Cards -->
        <div class="cards-grid">
            <a href="#" class="card card-messages">
                <div class="card-icon-box">
                    <i class="fa-solid fa-message"></i>
                </div>
                <span class="card-title">Messages</span>
            </a>

            <a href="#" class="card card-rooms">
                <div class="card-icon-box">
                    <i class="fa-solid fa-people-roof"></i>
                </div>
                <span class="card-title">Rooms</span>
            </a>

            <a href="#" class="card card-games">
                <div class="card-icon-box">
                    <i class="fa-solid fa-gamepad"></i>
                </div>
                <span class="card-title">Games</span>
            </a>
        </div>
    </main>
    <script src="js/user.js"></script>
</body>
</html>
